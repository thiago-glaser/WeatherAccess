##############################################################################
# WeatherAccess — STANDALONE mode
#
# Use this docker-compose only when running WeatherAccess WITHOUT the shared
# Nginx proxy (e.g. local testing, or the only service on the server).
#
# For production with multiple services on one server, use the Proxy project:
#   C:\Code\Proxy
#
# In standalone mode the app listens on HTTP 3000 (standard for Next.js).
##############################################################################
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: weatheraccess:latest
    container_name: weatheraccess-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - ECOWITT_API_URL=${ECOWITT_API_URL}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge
